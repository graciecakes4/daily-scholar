# Daily Scholar — local parity stack.
#
# Spins up Postgres + backend + frontend in three containers that mimic the
# Railway production deploy. Useful for:
#   - exercising the SQLite -> Postgres compat path before pushing
#   - testing image builds end-to-end
#   - giving beta testers a one-command "just run everything"
#
# Usage:
#   docker compose up --build
#   docker compose down
#   docker compose down -v        # also nukes persistent volumes
#
# Env: reads .env from the repo root for ANTHROPIC_API_KEY, GEMINI_API_KEY,
# VAPID_*, B2_* etc. See .env.example for the full list.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar
      POSTGRES_DB: daily_scholar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d daily_scholar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # override DATABASE_URL to point at the compose-managed postgres
      DATABASE_URL: postgresql+psycopg://scholar:scholar@postgres:5432/daily_scholar
      # Must be a URL your BROWSER can reach, not the compose-network
      # alias -- CORS already allows localhost:3000/127.0.0.1:3000 as a
      # hardcoded fallback regardless of this value (see
      # _resolve_cors_origins() in backend/main.py), so the only thing
      # this setting controls in local dev is the base URL used to build
      # links a human actually clicks, like the li3b password-reset
      # email. `http://frontend:3000` breaks that -- it only resolves
      # inside the Docker network. The frontend service's port is
      # published as 3000:3000, so localhost:3000 is the right value.
      FRONTEND_URL: http://localhost:3000
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # persistent local-mode data (PDFs when STORAGE_BACKEND=local)
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      # hot-edit topic configs without rebuilding the image
      - ./config/topics:/app/config/topics:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # BACKEND_INTERNAL_URL has to be a BUILD arg (not just runtime
      # env) because Next.js evaluates next.config.js `rewrites()` at
      # build time and bakes the destination into the route manifest.
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # mirror at runtime too — harmless, and lets any future code
      # path that reads the env at request time see the same value.
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  backend_data:
  backend_uploads:
